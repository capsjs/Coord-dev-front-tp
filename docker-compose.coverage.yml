# Surcharge utilisée par `make coverage` : l'API écrit sa couverture de code (V8) dans backend/coverage/tmp.
# Usage : docker compose -f docker-compose.yml -f docker-compose.coverage.yml up -d db backend
services:
  backend:
    environment:
      NODE_V8_COVERAGE: /app/coverage/tmp
    volumes:
      - ./backend/coverage:/app/coverage
