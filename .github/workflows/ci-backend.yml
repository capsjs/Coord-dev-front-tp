name: CI Back

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/ci-backend.yml'
      - 'docs/exigences.json'
      - 'docs/matrice-tracabilite.md'
      - 'e2e/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/ci-backend.yml'
      - 'docs/exigences.json'
      - 'docs/matrice-tracabilite.md'
      - 'e2e/**'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Échoue tout de suite si docker-compose.yml est invalide (indentation, clé mal placée…).
      - name: Valider docker-compose.yml
        working-directory: .
        run: docker compose config -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Tests unitaires : pas besoin de Docker ni de base, retour en quelques secondes.
      - run: npm run test:unit
      # Matrice exigence → test → version : complète et à jour (docs/matrice-tracabilite.md).
      - run: npm run matrix:check

  test:
    name: Build et tests d'intégration
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      # Construit l'image Docker de l'API, démarre MySQL + l'API (avec mesure de couverture),
      # lance les tests d'intégration puis unitaires, et produit le rapport.
      # Échoue si un test échoue ou si la couverture passe sous les seuils de backend/.c8rc.json.
      - name: Build, tests et couverture
        working-directory: .
        run: make coverage

      # Scénarios Gherkin (SCRUM-74) : les critères d'acceptation des stories, exécutés contre l'API démarrée.
      - name: Scénarios Gherkin (niveau API)
        working-directory: .
        run: make bdd

      - name: Rapport des scénarios Gherkin
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-gherkin
          path: e2e/playwright-report/
          if-no-files-found: ignore

      - name: Résumé de la couverture
        if: always()
        working-directory: .
        run: |
          if [ -f backend/coverage/report/coverage-summary.json ]; then
            node -e '
              const t = require("./backend/coverage/report/coverage-summary.json").total;
              const row = (k, l) => `| ${l} | ${t[k].pct} % | ${t[k].covered} / ${t[k].total} |`;
              console.log(["## Couverture du back", "", "| | % | Couvert |", "|---|---|---|",
                row("lines", "Lignes"), row("branches", "Branches"), row("functions", "Fonctions"), row("statements", "Instructions")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport de couverture (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-back
          path: backend/coverage/report/
          if-no-files-found: ignore

      - name: Logs en cas d'échec
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Arrêt de la stack
        if: always()
        working-directory: .
        run: docker compose down -v
