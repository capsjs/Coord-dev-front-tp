services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-events}
      MYSQL_USER: ${DB_USER:-events}
      MYSQL_PASSWORD: ${DB_PASSWORD:-events}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      # 127.0.0.1 force le TCP : le serveur temporaire d'initialisation n'écoute pas le réseau.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-events}
      DB_USER: ${DB_USER:-events}
      DB_PASSWORD: ${DB_PASSWORD:-events}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-a-changer}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@events.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
