server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Les routes de React Router (/events, /login…) n'existent pas sur le disque :
    # si aucun fichier ne correspond, on renvoie index.html et React affiche la bonne page
    try_files $uri $uri/ /index.html;
  }
}
